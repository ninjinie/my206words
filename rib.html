    <script src="shared.js"></script>
    <script src="global.js"></script>
    <script>
        // Ribs: each rib outline is drawn as open lines, so most of it can't fill by itself.
        // The shapes in #rib-fills cover the rest of each rib: they copy the rib's color,
        // and a click (or hover in info mode) on them goes to the rib itself, so it stays one bone.
        (() => {
            const shapes = document.querySelectorAll('#rib-fills polygon');
            const sync = (rib) => shapes.forEach(shape => {
                if (shape.dataset.rib === rib.id) shape.style.fill = rib.style.fill;
            });
            document.querySelectorAll('#ribs path').forEach(rib => {
                sync(rib);
                new MutationObserver(() => sync(rib)).observe(rib, { attributes: true, attributeFilter: ['style'] });
            });
            const forward = (type, Make) => shapes.forEach(shape => shape.addEventListener(type, (event) => {
                event.stopPropagation();
                document.getElementById(shape.dataset.rib).dispatchEvent(new Make(type, {
                    bubbles: true, clientX: event.clientX, clientY: event.clientY, pointerType: event.pointerType
                }));
            }));
            forward('click', MouseEvent);
            forward('pointermove', PointerEvent);
        })();
    </script>
