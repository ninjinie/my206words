            <input id="inputField" type="text" placeholder="Enter a word...">
            <div class="text-settings" id="textSettings">
                <button class="font-size">15</button>
                <button class="bold">B</button>
                <button class="italic">I</button>
                <button class="underline">A</button>
                <button class="letter-spacing"><span>T</span><span class="arrows">↔</span></button>

            <div class="circle" id="color-six"></div>
            <div class="circle" id="color-one"></div>

            <div class="circle" id="color-four"></div>
            <div class="circle" id="color-five"></div>
            <div class="circle" id="color-seven"></div>
            <label class="circle wheel">
                <input type="color" id="colorPicker" value="#ff0000">
            </label>
        </div>


        <button class="hide-btn">Hide</button>
        <button class="undo-btn">Undo</button>
        <button class="download-btn">Download</button>
    </div>
    <dialog id="downloadDialog">
        <p>Download as</p>
        <button data-format="svg">SVG</button>
        <button data-format="png">PNG</button>
        <button data-format="jpg">JPG</button>
        <button data-format="cancel">Cancel</button>
        <p><small>Hidden words are exported as their first letter only.</small></p>
    </dialog>
    <script src="shared.js"></script>
    <script src="global.js"></script>
