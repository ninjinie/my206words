            <button class="bold">B</button>
            <button class="italic">I</button>

        <div class="circle" id="color-five"></div>
        <div class="circle" id="color-seven"></div>

        </label>
    </div>


    <button class="hide-btn">Hide</button>

    <button class="download-btn">Download</button>
    </div>
    <dialog id="downloadDialog">

        <button data-format="svg">SVG</button>
        <button data-format="png">PNG</button>
        <button data-format="jpg">JPG</button>
        <button data-format="cancel">Cancel</button>

    </dialog>

    <script src="global.js"></script>
